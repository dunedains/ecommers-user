spring.application.name=users
server.port=8082

# PostgreSQL DataSource
spring.datasource.url=jdbc:postgresql://localhost:5432/db_users
spring.datasource.username=ecommers
spring.datasource.password=ecommers_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration


# Trazas distribuidas (Micrometer -> Tempo)
# Actuator: exponer solo health (lo consulta el healthcheck de docker-compose)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
