spring:
  application:
    name: users
  # Perfil por defecto para desarrollo local; en Docker se activa el perfil "docker"
  profiles:
    default: dev
  datasource:
    # Credenciales externalizables por variables de entorno (no quedan fijas en el codigo)
    url: ${DB_URL:jdbc:postgresql://localhost:5432/db_users}
    username: ${DB_USERNAME:ecommers}
    password: ${DB_PASSWORD:ecommers_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

---
# Perfil docker: se activa en los contenedores (SPRING_PROFILES_ACTIVE=docker).
# Desactiva el SQL por consola; los logs van estructurados en JSON hacia Loki.
spring:
  config:
    activate:
      on-profile: docker
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
